[project]
name = "gitlab-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.27.0",
    "python-dotenv>=1.2.2",
    "python-gitlab>=8.3.0",
]

[project.scripts]
gitlab-mcp = "main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "gitlab_tools.py", "config/"]
